services:
  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_HTTP_PORT:-8021}:80"
      - "${FRONTEND_HTTPS_PORT:-8443}:443"
    depends_on:
      price-tag-pipeline:
        condition: service_started

  price-tag-pipeline:
    restart: unless-stopped
    build:
      context: .
    entrypoint: ["uvicorn"]
    command: ["price_tag_pipeline.api.main:app", "--host", "0.0.0.0", "--port", "8020", "--reload"]
    ports:
      - "127.0.0.1:8020:8020"
    environment:
      PRICE_TAG_OCR_BASE_URL: "${PRICE_TAG_OCR_BASE_URL:-http://llama-cpp:8080/v1}"
      PRICE_TAG_OCR_API_KEY: "${PRICE_TAG_OCR_API_KEY:-not-needed}"
      PRICE_TAG_OCR_MODEL: "${PRICE_TAG_OCR_MODEL:-local-vlm}"
      PRICE_TAG_OCR_MAX_TOKENS: "${PRICE_TAG_OCR_MAX_TOKENS:-900}"
      PRICE_TAG_OCR_TEMPERATURE: "${PRICE_TAG_OCR_TEMPERATURE:-0.0}"
      PRICE_TAG_OCR_TIMEOUT: "${PRICE_TAG_OCR_TIMEOUT:-180.0}"
      PRICE_TAG_OCR_RETRIES: "${PRICE_TAG_OCR_RETRIES:-1}"
      PRICE_TAG_OCR_RESPONSE_FORMAT: "${PRICE_TAG_OCR_RESPONSE_FORMAT:-false}"
      PRICE_TAG_OCR_DISABLE_REASONING: "${PRICE_TAG_OCR_DISABLE_REASONING:-true}"
      PRICE_TAG_API_PIPELINE_ARGS: "${PRICE_TAG_API_PIPELINE_ARGS:---detector onnx --frame-step 3 --run-ocr}"
      LLAMA_CPP_BASE_URL: "${LLAMA_CPP_BASE_URL:-http://llama-cpp:8080/v1}"
      LLAMA_CPP_API_KEY: "${LLAMA_CPP_API_KEY:-not-needed}"
      LLAMA_CPP_MODEL: "${LLAMA_CPP_MODEL:-local-vlm}"
    depends_on:
      llama-cpp:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ./runs:/app/runs
      - "${PRICE_TAG_DATA_DIR:-./data}:/data:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  model-progress:
    restart: "no"
    image: "python:3.11-slim"
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/workspace:ro
      - hf-cache:/root/.cache/huggingface
    working_dir: /workspace
    depends_on:
      llama-cpp:
        condition: service_started
    command:
      - /bin/sh
      - -lc
      - >
        python -m pip install --no-cache-dir "huggingface_hub>=0.23,<1.0"
        && python tools/monitor_hf_cache_progress.py
        --repo-id "${LLAMA_CPP_HF_MODEL:-unsloth/NVIDIA-Nemotron-3-Nano-Omni-30B-A3B-Reasoning-GGUF}"
        --selector "${LLAMA_CPP_HF_SELECTOR:-UD-Q3_K_M}"
        --cache-dir /root/.cache/huggingface

  llama-cpp:
    restart: unless-stopped
    image: "${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}"
    pull_policy: "${LLAMA_CPP_PULL_POLICY:-always}"
    ports:
      - "${LLAMA_CPP_PORT:-18080}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 2h
    command:
      - -hf
      - "${LLAMA_CPP_HF_MODEL:-unsloth/NVIDIA-Nemotron-3-Nano-Omni-30B-A3B-Reasoning-GGUF}:${LLAMA_CPP_HF_SELECTOR:-UD-Q3_K_M}"
      - --alias
      - "${LLAMA_CPP_MODEL:-local-vlm}"
      - -c
      - "${LLAMA_CPP_CTX_SIZE:-8192}"
      - -ngl
      - "${LLAMA_CPP_N_GPU_LAYERS:-28}"
      - --parallel
      - "${LLAMA_CPP_PARALLEL:-1}"
      - --reasoning
      - "off"
      - --reasoning-budget
      - "0"
      - --host
      - 0.0.0.0
      - --port
      - "8080"

volumes:
  hf-cache:
